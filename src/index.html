<!DOCTYPE html>

<html>
    <head>
        <title>Money Converter</title>
        <link rel="stylesheet" href="styles/index.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="live-currencies">
                <div class="currencies">
                    <a id="gold">Gold</a>
                    <a id="silver">Silver</a>
                    <a id="btc">BTC</a>
                </div>

              </div>
        </header>
        <main>
            <div class="conversion-container">
                
                <div class="container">
                    <div class="base-currency">
                        <input class="amount" autocomplete="off" placeholder="Amount" type="number" id="amountFromFirstInput">
                        <select class="amount" id="baseCurrency"></select>
                    </div>
                    <div class="swap-row">
                      <div class="swap-btn"><span class="material-icons">swap_vert</span></div>
                    </div>
                    <div class="desired-currency">
                        <input class="amount" id="amountFromSecondInput" autocomplete="off" placeholder="Amount" type="number">
                        <select class="amount" id="desiredCurrency"></select>
                    </div>
                </div>
            </div>
            <a class ="bulle-1">CURRENCY CONVERTOR</a>
            <a class ="bulle-2">LOL</a>
        </main>
        <footer>

        </footer>

        <script type="module">
            import { main } from './ts/main.ts'

            if (typeof document !== "undefined") {
                main();
            }
        </script>
    </body>
</html>
