<!DOCTYPE html>

<html>
    <head>
        <title id="titleContainer"></title>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="stylesheet" href="./styles/fonts.css">
        <link rel="stylesheet" href="./styles/body.css">
        <link rel="stylesheet" href="./styles/index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <div class="live-currencies">
              <div class="currencies" id="liveCurrenciesContainer">
              </div>
            </div>
            <div class="lang-selector" id="langSelector">
              <select class="lang-select" id="langSelect"></select>
            </div>
        </header>
        <main>
            <div class="conversion-container">
                
                <div class="container">
                    <div class="base-currency">
                        <input class="amount" autocomplete="off" placeholder="Amount" type="number" id="amountFromFirstInput">
                        <select class="amount" id="baseCurrency"></select>
                    </div>
                    <div class="swap-row">
                      <div class="swap-btn"><span class="material-icons">swap_vert</span></div>
                    </div>
                    <div class="desired-currency">
                        <input class="amount" id="amountFromSecondInput" autocomplete="off" placeholder="Amount" type="number">
                        <select class="amount" id="desiredCurrency"></select>
                    </div>
                </div>
            </div>
            <a class ="bulle-1" id ="subtitleContainer"></a>
        </main>

        <script type="module">
            import { main } from './ts/main.ts'

            if (typeof document !== "undefined") {
                main();
            }
        </script>
    </body>
</html>
