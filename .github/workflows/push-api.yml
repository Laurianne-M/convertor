name: API Backend CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
  test:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: make -C src/api install

    - name: Unit tests
      run: make -C src/api test

  # Required status check job for API branch protection
  api-check:
    runs-on: ubuntu-24.04
    needs: [changes, test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Status
        run: .github/scripts/evaluate-status.sh "${{ join(needs.*.result, ' ') }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: make -C src/api install
    - name: Deploy Firebase Functions
      run: make -C src/api deploy
      env: 
        VITE_EXCHANGE_RATES_API_KEY: ${{ secrets.VITE_EXCHANGE_RATES_API_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
