name: API Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: make -C src/api install
    - name: Run linter
      run: make -C src/api lint

    - name: Unit tests
      run: make -C src/api test

  # Required status check job for API branch protection
  status-check:
    runs-on: ubuntu-24.04
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Status
        run: .github/scripts/evaluate-workflow-status.sh "${{ join(needs.*.result, ' ') }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: [status-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: make -C src/api install

    - name: Create production environment file
      run: |
        echo "EXCHANGE_RATES_API_KEY=${{ secrets.EXCHANGE_RATES_API_KEY }}" >> .env

    - name: Deploy Firebase Functions
      run: make -C src/api deploy
      env: 
        VITE_EXCHANGE_RATES_API_KEY: ${{ secrets.EXCHANGE_RATES_API_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
