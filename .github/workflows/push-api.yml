name: API Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env: 
  EXCHANGE_RATES_API_KEY: ${{ secrets.VITE_EXCHANGE_RATES_API_KEY }}
  EXCHANGE_RATES_API_URL: ${{ secrets.VITE_API_URL }}
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: make -C src/api install

    - name: Run linter
      run: make -C src/api lint

    - name: Unit tests
      run: make -C src/api test

    - name: Production build
      run: make -C src/api predeploy

    - name: Upload production build
      uses: actions/upload-artifact@v4
      with:
        name: api-lib
        path: src/api/lib
        retention-days: 1

  # Required status check job for API branch protection
  status-check:
    runs-on: ubuntu-24.04
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Status
        run: .github/scripts/evaluate-workflow-status.sh "${{ join(needs.*.result, ' ') }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: [status-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Download compiled lib
      uses: actions/download-artifact@v4
      with:
        name: api-lib
        path: src/api/lib

    - name: Install dependencies
      run: make -C src/api install-firebase

    - name: Deploy Firebase Functions
      run: make -C src/api deploy
