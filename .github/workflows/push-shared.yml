name: Shared Unit Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: make -C src/shared install

    - name: Unit tests
      run: make -C src/shared test-unit
