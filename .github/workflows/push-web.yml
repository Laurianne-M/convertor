name: Web Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        
    - name: Install dependencies
      run: make -C src/web install

    - name: Run linter
      run: make -C src/web lint

    - name: Install Playwright browsers and dependencies  
      run:  make -C src/web install-e2e
      
    - name: E2E tests
      run: make -C src/web test-e2e

    - name: Unit tests
      run: make -C src/web test-unit

    - name: Create production environment file
      run: |
        echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> src/web/.env.prod
        echo "VITE_EXCHANGE_RATES_API_KEY=${{ secrets.VITE_EXCHANGE_RATES_API_KEY }}" >> .env.prod

    - name: Production build
      run: make -C src/web build
  
    - name: Upload production build
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: src/web/build
        retention-days: 1

  status-check:
    runs-on: ubuntu-24.04
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Status
        run:  .github/scripts/evaluate-workflow-status.sh "${{ join(needs.*.result, ' ') }}"

  deployment:
    runs-on: ubuntu-24.04
    needs: [status-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Clone repository for production build
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: src/web/build

      - name: Install Firebase
        run: make -C src/web install-firebase

      - name: Deploy Firebase Hosting
        run: make -C src/web deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}