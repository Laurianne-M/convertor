name: Web Frontend CI
on:
  push:
    branches: [ main ]
    paths:
      - 'src/web/**'
      - '.github/workflows/*.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/web
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: make install

    - name: Install Playwright browsers and dependencies  
      run:  npx playwright install-deps webkit && npx playwright install webkit
      
    - name: E2E tests
      run: make test-e2e

    - name: Unit tests
      run: make test-unit

  production-deployment:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - name: Clone repository for production build
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: make -C src/web install
      - name: Build
        run: make -C src/web build
        env:
          VITE_EXCHANGE_RATES_API_KEY: ${{ secrets.VITE_EXCHANGE_RATES_API_KEY}}
      - name: Deploy to Firebase Live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONVERTOR_2B5DD }}
          projectId: convertor-2b5dd
          channelId: live
