name: On push
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: make install
    - name: Install Playwright browsers  
      run: npx playwright install --with-deps chromium
      working-directory: src        # ← uses the correct local version
    - name: E2E tests
      run: make e2e
    - name: Unit tests
      run: make test
    - name: Build
      run: make build-all
