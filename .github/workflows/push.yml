name: On push
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: make install

    - name: Install Playwright browsers and dependencies  
      run:  sudo npx playwright install-deps webkit && npx playwright install webkit
      
    - name: E2E tests
      run: make e2e

    - name: Unit tests
      run: make test
