name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
              - 'package*.json'
            web:
              - 'src/web/**'
              - 'package*.json'

  test-api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Run API Tests
        run: |
          npm ci --prefix src/api
          npm test --prefix src/api

  test-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Run Web Tests
        run: |
          npm ci --prefix src/web
          npm test --prefix src/web

  # Set this single job as your required status check in GitHub branch rules
  ci-check:
    runs-on: ubuntu-latest
    needs: [changes, test-api, test-web]
    if: always()
    steps:
      - name: Evaluate Test Statuses
        run: |
          STATUSES="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $STATUSES"
          if echo "$STATUSES" | grep -E "failure|cancelled"; then
            echo "A required test failed or was cancelled."
            exit 1
          fi
          echo "All checks passed or were safely skipped."